plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ezsign.writer'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.ezsign.writer'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally empty. Android framework only.
}
