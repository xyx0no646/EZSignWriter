name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Protocol self-test
        run: sh ./tools/run-self-test.sh

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EZSignWriter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare directly downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EZSignWriter.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest \
              --target "$GITHUB_SHA" \
              --title "最新版 APK（デバッグビルド）" \
              --notes "Android用APKをそのままダウンロードできます。GitHub Actionsでビルドしたデバッグ署名版です。" \
              --latest
          fi
          gh release upload apk-latest dist/EZSignWriter.apk --clobber
